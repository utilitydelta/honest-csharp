name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: ./check.sh
      - name: pack
        run: |
          VERSION=1.0.1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          dotnet pack src/Honest.Analyzers/Honest.Analyzers.csproj -c Release -o out -p:Version="$VERSION" --nologo
          dotnet pack src/Honest.Runtime/Honest.Runtime.csproj -c Release -o out -p:Version="$VERSION" --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/*.nupkg

  publish:
    # Tag-only. Uses nuget.org trusted publishing (OIDC): no long-lived API key in the repo.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: out
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: utilitydelta
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
